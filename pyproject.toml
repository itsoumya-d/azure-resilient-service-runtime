[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-resilient-service-runtime"
version = "0.1.0"
description = "Resilient cloud service runtime for Azure high-availability microservices: health probes, circuit breaker, failover routing, and telemetry audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
